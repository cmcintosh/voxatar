services:
  voxatar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - voxatar-data:/app/data
      - ../examples:/app/agents-read-only:ro
    restart: unless-stopped

volumes:
  voxatar-data: