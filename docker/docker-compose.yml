# Voxatar Docker Compose — Phase 1 MVP
#
# Usage:
#   docker compose up
#
# Then open http://localhost:8080 in your browser.

services:
  voxatar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: voxatar
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Agent configs
      - ../examples:/app/examples:ro
      # Models (faster-whisper will cache here)
      - voxatar-models:/root/.cache
      # Knowledge base (Phase 2)
      - ../knowledge:/app/knowledge:ro
      # Avatars (Phase 2)
      - ../avatars:/app/avatars:ro
    command: >
      voxatar serve
      --agent examples/simple-agent.yaml
      --host 0.0.0.0
      --port 8080
      --ollama-url http://host.docker.internal:11434/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Ollama service (optional — if running on host, comment this out)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: voxatar-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   # On Mac, Ollama runs better natively — use host Ollama instead
  #   profiles:
  #     - with-ollama

volumes:
  voxatar-models:
  # ollama-models: