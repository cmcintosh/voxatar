<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8edf2"/>
      <stop offset="100%" stop-color="#d1dae3"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b6fb6"/>
      <stop offset="100%" stop-color="#2c5a94"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d5b6"/>
      <stop offset="100%" stop-color="#e8c89c"/>
    </linearGradient>
    <clipPath id="headClip">
      <circle cx="100" cy="82" r="42"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Shirt / shoulders -->
  <path d="M 50 200 Q 50 140 100 135 Q 150 140 150 200 Z" fill="url(#shirt)"/>
  <!-- Collar -->
  <path d="M 85 135 Q 100 148 115 135 L 112 160 Q 100 165 88 160 Z" fill="#2c5a94"/>
  <path d="M 85 135 Q 100 148 115 135 L 110 155 Q 100 160 90 155 Z" fill="#1e4076"/>

  <!-- Neck -->
  <rect x="88" y="115" width="24" height="25" fill="url(#skin)"/>
  <rect x="88" y="115" width="24" height="8" fill="#dab98c" opacity="0.5"/>

  <!-- Head -->
  <circle cx="100" cy="82" r="42" fill="url(#skin)"/>

  <!-- Ears -->
  <ellipse cx="59" cy="82" rx="7" ry="11" fill="url(#skin)"/>
  <ellipse cx="141" cy="82" rx="7" ry="11" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M 62 75 Q 60 48 100 44 Q 140 48 138 75 Q 136 58 120 52 Q 100 48 80 52 Q 64 58 62 75 Z" fill="#3d2f24"/>
  <path d="M 62 72 Q 65 55 85 50 L 82 62 Q 72 64 66 72 Z" fill="#4a3a2e"/>
  <path d="M 138 72 Q 135 55 115 50 L 118 62 Q 128 64 134 72 Z" fill="#4a3a2e"/>

  <!-- Eyebrows -->
  <path d="M 76 72 Q 82 68 88 72" stroke="#3d2f24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 112 72 Q 118 68 124 72" stroke="#3d2f24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="80" rx="4.5" ry="3.5" fill="white"/>
  <ellipse cx="118" cy="80" rx="4.5" ry="3.5" fill="white"/>
  <circle cx="82" cy="80" r="2.5" fill="#4a3a2e"/>
  <circle cx="118" cy="80" r="2.5" fill="#4a3a2e"/>
  <circle cx="83" cy="79" r="0.8" fill="white"/>
  <circle cx="119" cy="79" r="0.8" fill="white"/>

  <!-- Nose -->
  <path d="M 100 84 Q 97 92 94 97 Q 97 99 100 99 Q 103 99 106 97 Q 103 92 100 84" fill="#dab98c" opacity="0.6"/>
  <path d="M 98 94 Q 100 96 102 94" stroke="#dab98c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 84 103 Q 100 113 116 103" stroke="#b07850" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Subtle cheeks -->
  <circle cx="72" cy="95" r="6" fill="#e8a0a0" opacity="0.25"/>
  <circle cx="128" cy="95" r="6" fill="#e8a0a0" opacity="0.25"/>
</svg>